name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-flight production deploy; queue the newer one instead so
# the site never ends up half-deployed.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate and build production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The WC project id is a public identifier (it ships in the bundle by
      # design); the secret just keeps it out of the repo. Fail fast if unset —
      # a build without it produces a site whose wallet pairing cannot work.
      - name: Ensure WalletConnect project id is configured
        env:
          VITE_WC_PROJECT_ID: ${{ secrets.VITE_WC_PROJECT_ID }}
        run: test -n "$VITE_WC_PROJECT_ID"

      # CI and Security are independent push workflows, so their completion
      # cannot gate this workflow directly. Re-run both release gates here on
      # the exact commit and dependency set that will become the Pages artifact.
      - name: Audit shipped dependencies
        run: npm run test:security

      - name: Validate and build release
        env:
          VITE_WC_PROJECT_ID: ${{ secrets.VITE_WC_PROJECT_ID }}
        run: npm run check

      # SPA fallback: the router uses web history, so a direct navigation to
      # /requests must serve index.html instead of GitHub Pages' 404.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
